LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
User doaide
Foreground yes
LogTime yes
LogClean no
StreamMaxLength 10M
MaxScanSize 32M
MaxFileSize 30M
MaxRecursion 10
MaxThreads 2
MaxQueue 8
ReadTimeout 45
CommandReadTimeout 5
ConcurrentDatabaseReload no
SelfCheck 600
FailIfCvdOlderThan 3
AlertExceedsMax yes
AlertEncrypted yes
