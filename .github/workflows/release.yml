name: Build verified release images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"
      - run: uv sync --locked
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: uv run pytest -q
      - run: docker build --target runtime -t doaide-suite:release-validation .
      - run: docker build --target ocr-worker -t doaide-suite-worker:release-validation .
      - run: docker build -f deploy/clamav/Dockerfile -t doaide-suite-scanner:release-validation .
      - run: uv run python scripts/check_production_stack.py > production-stack-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-stack-check
          path: production-stack-check.json
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - service: api
            file: Dockerfile
            target: runtime
          - service: worker
            file: Dockerfile
            target: ocr-worker
          - service: scanner
            file: deploy/clamav/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/doaideai/doaide-suite-${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/DoAideAi/DoAide-Suite
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Record immutable image
        env:
          IMAGE: ghcr.io/doaideai/doaide-suite-${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$IMAGE" > image-${{ matrix.service }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: image-${{ matrix.service }}.txt
