name: Validate suite
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: uv run pytest -q
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit
      - run: docker build -t doaide-suite:validation .
      - run: uv run python scripts/check_container.py --image doaide-suite:validation
